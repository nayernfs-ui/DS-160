name: Live Smoke Test (Temp CI check)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  live-smoke-ci:
    name: Run live smoke script (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run env audit (warn only)
        run: node tools/check-env.js || true

      - name: Run live puppeteer visits smoke test
        env:
          TARGET_URL: https://ds-160-jet.vercel.app/
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: node tools/puppeteer-visits-live.js

  # NOTE: This is temporary for diagnosis; remove after investigation.
