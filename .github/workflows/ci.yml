name: Code Quality & Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (fail on warnings)
        run: npm run lint:ci

      - name: Run HTML linter
        run: npm run lint:html

      - name: Run tests
        run: npm test

      - name: Run DOCX Smoke Test
        run: npm run smoke-docx
