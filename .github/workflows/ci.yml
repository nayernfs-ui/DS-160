name: Code Quality & Smoke Tests

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional URL to run Puppeteer smoke tests against (e.g. https://my-preview.example)'
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (fail on warnings)
        run: npm run lint:ci

      - name: Run HTML linter
        run: npm run lint:html

      - name: Run tests
        run: npm test

      - name: Run DOCX Smoke Test
        run: npm run smoke-docx

  smoke-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' }}
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      TEST_ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Puppeteer smoke test (against provided target_url)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: node tests/e2e/puppeteer-relatives-smoke.js

      - name: Upload Puppeteer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppeteer-artifacts
          path: test-artifacts/**

  smoke-local:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      TEST_ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (system) and Puppeteer browser (robust)
        run: |
          sudo apt-get update -y
          # Try multiple package names to ensure a Chromium binary is present on ubuntu-latest
          sudo apt-get install -y chromium chromium-browser chromium-chromedriver || true
          # Install additional system libraries required by headless Chromium
          sudo apt-get install -y ca-certificates fonts-liberation libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdbus-1-3 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxss1 libxtst6 libnss3 libgtk-3-0 libgbm1 || true
          # Try to let Puppeteer download its compatible Chromium; tolerate failures
          npx puppeteer install chromium --silent || echo "puppeteer install failed; will try system Chromium"
          # Diagnostics to help debug CI failures
          echo "Chromium detected at:" $(which chromium || which chromium-browser || true)
          chromium --version || chromium-browser --version || true
          node -e "try { const p = require('puppeteer'); console.log('puppeteer executablePath:', typeof p.executablePath === 'function' ? p.executablePath() : (p._preferredRevision || 'n/a')); } catch(e){ console.error('puppeteer require failed:', e && e.message); }"
          # Export path & recommended flags for later steps
          echo "PUPPETEER_EXECUTABLE_PATH=$(which chromium || which chromium-browser || true)" >> $GITHUB_ENV
          echo "CHROME_FLAGS=--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --no-zygote --single-process --disable-software-rasterizer" >> $GITHUB_ENV

      - name: Start static server
        run: |
          npx http-server -p 3000 -c-1 &
          # wait for server to be ready
          for i in 1 2 3 4 5; do
            if curl -sSf "http://127.0.0.1:3000" >/dev/null; then
              echo "Server up" && break
            fi
            echo "Waiting for server..."
            sleep 2
          done

      - name: Run Puppeteer smoke test (local)
        env:
          TARGET_URL: 'http://127.0.0.1:3000'
        run: node tests/e2e/puppeteer-relatives-smoke.js

      - name: Upload Puppeteer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppeteer-artifacts
          path: test-artifacts/**
