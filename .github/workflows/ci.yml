name: Code Quality & Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional URL to run Puppeteer smoke tests against (e.g. https://my-preview.example)'
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (fail on warnings)
        run: npm run lint:ci

      - name: Run HTML linter
        run: npm run lint:html

      - name: Run tests
        run: npm test

      - name: Run DOCX Smoke Test
        run: npm run smoke-docx

  smoke-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Puppeteer smoke test (against provided target_url)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: node tests/e2e/puppeteer-relatives-smoke.js
